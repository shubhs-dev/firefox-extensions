<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Helper settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <form id="form">
    <h1>CSS selector per site</h1>
    <p class="hint">On each site, the first element matching its selector is copied after the URL, separated by a space. <code>www.</code> is ignored in hostnames.</p>
    <div class="grid header">
      <span>Hostname</span>
      <span>CSS selector</span>
      <span></span>
    </div>
    <div id="rows"></div>
    <div class="row">
      <button type="button" id="add">Add site</button>
      <button type="submit">Save</button>
      <span id="status" role="status"></span>
    </div>
  </form>
  <script src="../defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
